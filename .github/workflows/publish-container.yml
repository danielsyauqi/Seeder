name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to publish from a release workflow
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: danielsyauqi/seeder

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [ -n "$tag" ]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a vX.Y.Z release tag, got: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
            echo 'is_main=false' >> "$GITHUB_OUTPUT"
          else
            echo 'is_release=false' >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo 'is_main=true' >> "$GITHUB_OUTPUT"
            else
              echo 'is_main=false' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.DOCKER_USERNAME }}/seeder-oss
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.tags.outputs.is_main }}
            type=raw,value=${{ steps.tags.outputs.version }},enable=${{ steps.tags.outputs.is_release }}
            type=raw,value=${{ steps.tags.outputs.minor }},enable=${{ steps.tags.outputs.is_release }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
