name: CI

# Runs the same gates contributors are asked to run locally (see CONTRIBUTING.md)
# on every PR and on pushes to main, so a fork can't silently regress lint,
# types, tests, or either deployment build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build Node
        run: npm run build:node
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build
      - name: Check Worker excludes libSQL
        run: |
          if [ -n "$(find .open-next -iname '*libsql*' -print -quit)" ]; then
            echo 'The Cloudflare bundle contains libSQL files.' >&2
            exit 1
          fi
